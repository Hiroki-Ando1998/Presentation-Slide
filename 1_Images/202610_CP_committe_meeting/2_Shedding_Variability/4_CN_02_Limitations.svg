ont-weight="400" font-size="24" transform="translate(417.092 309)">individual variability of shedding dynamics (i.e., shedding decay rate)</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(114.925 214)">•</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(144.925 214)">Shedding load variability was investigated using only two studies.</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(114.925 490)">•</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(144.925 490)">The real</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(232.925 490)">-</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(240.925 490)">world application</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(426.259 490)">i</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(431.592 490)">s</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(450.259 490)">conducted using only one publicity available dataset</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(116.425 399)">•</text><text fill="#5F696E" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(146.425 399)">Model parameters were assumed to be constant over time.</text></g></svg>