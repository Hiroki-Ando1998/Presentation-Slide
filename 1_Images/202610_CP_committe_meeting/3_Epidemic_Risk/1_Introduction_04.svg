<svg width="1282" height="723" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><g transform="translate(1 2)"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="37" transform="translate(24.7011 101)">Limitations of</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="37" transform="translate(280.034 101)">the</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="37" transform="translate(346.534 101)">previous</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="37" transform="translate(512.701 101)">w</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="37" transform="translate(541.701 101)">astewater</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="37" transform="translate(714.368 101)">-</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="37" transform="translate(726.868 101)">based</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="37" transform="translate(845.368 101)">identification</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="37" transform="translate(1088.37 101)">approach</text><rect x="0.500053" y="0.500053" width="321" height="37" stroke="#7F7F7F" stroke-width="1.33333" stroke-miterlimit="8" fill="#4B5E68"/><text fill="#FFFFFF" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="21" transform="translate(98.3799 27)">Introduction</text><rect x="320.5" y="0.500053" width="321" height="37" stroke="#7F7F7F" stroke-width="1.33333" stroke-miter