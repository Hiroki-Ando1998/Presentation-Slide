e="24" transform="translate(591.364 269)">are largely empirical</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(812.697 269)">and have limited</text><path d="M591.03 271.227 702.03 271.227 813.03 271.227 813.03 272.227 702.03 272.227 591.03 272.227Z" fill="#4B5E68" fill-rule="evenodd"/><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(298.03 298)">epidemiological justification.</text><path d="M235 275C235 264.507 243.059 256 253 256 262.941 256 271 264.507 271 275 271 285.493 262.941 294 253 294 243.059 294 235 285.493 235 275Z" fill="#4B5E68" fill-rule="evenodd"/><text fill="#FFFFFF" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(246.708 284)">2</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(298.03 546)">The previous approaches typically focus on current conditions and</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(298.03 575)">lack a perspective on future epidemic dynamics</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(802.03 575)">.</text><path d="M298.03 577.422 466.03 577.422 634.03 577.422 802.03 577.422 802.03 578.422 634.03 578.422 466.03 578.422 298.03 578.422Z" fill="#4B5E68" fill-rule="evenodd"/><path d="M235 548.5C235 537.73 243.059 529 253 529 262.941 529 271 537.73 271 548.5 271 559.27 262.941 568 253 568 243.059 568 235 559.27 235 548.5Z" fill="#4B5E68" fill-rule="evenodd"/><text fill="#FFFFFF" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(246.708 557)">3</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(307.763 639)">Risk assessments should incorporate the projection of how many new</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(307.763 668)">infections will occur in the coming weeks.</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(244.975 644)">i.e.,</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(298.03 448)">•</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(328.03 448)">Comparing with the baseline alone does not guarantee that the</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(328.03 477)">healthcare system is safe.</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(298.03 365)">•</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(328.03 365)">A major epidemic inflates the baseline for the following year,</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(328.03 394)">while a year with minimal cases lowers it</text></g></svg>