te(818.423 183)">28)</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(66.8701 474)">3. Wastewater</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(225.977 474)">-</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(233.977 474)">based risk assessment of epidemic onset</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(713.977 474)">(Slide:</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(788.643 474)">4</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(801.977 474)">8</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(821.977 474)">-</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(836.643 474)">68)</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(66.8701 318)">2. Robust wastewater</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(312.203 318)">-</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(320.203 318)">based estimation of epidemic dynamics by accounting for shedding variability</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(66.8701 347)">(Slide: 30</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(174.87 347)">-</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(189.537 347)">45)</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(66.8701 612)">4. Wastewater</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(225.977 612)">-</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(233.977 612)">based risk assessment of nosocomial infection risk</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(828.643 612)">(Slide:</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(903.31 612)">7</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(916.643 612)">1</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(936.643 612)">-</text><text fill="#264980" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(951.31 612)">95)</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="32" transform="translate(19.4724 40)">Specific Aims:</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(92.0993 227)">Left</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(127.766 227)">-</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(134.933 227)">censored (non</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(271.266 227)">-</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(278.433 227)">detection) data occur during the</text><text fill="#953735" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(584.599 227)">early phase of epidemic</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(809.766 227)">, hindering accurate understanding of</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(92.0993 252)">disease dynamics through wastewater surveillance. To address the issue, this study develops a state</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(1042.68 252)">-</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(1049.85 252)">space model for</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(92.0993 278)">handling left</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(206.933 278)">-</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(214.099 278)">censored wastewater data.</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(85.3875 515)">This study develop a modeling framework for estimating epidemic risk to inform timing of public health intervention. Using</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(85.3875 540)">wastewater data, this study estimates the probability that the cumulative number of infected individuals over the following</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(85.3875 566)">weeks exceed a locally</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(303.221 566)">-</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(310.388 566)">determined threshold.</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(84.4023 645)">This study develops a modeling framework for estimating nosocomial infection risk. By combining municipal wastewater</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(84.4023 670)">surveillance data and hospital surveillance data, this study estimates the probability that at least one nosocomial</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(84.4023 696)">infection occur in the following week.</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(82.4995 383)">Existing methods to estimate</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(361.333 383)">I</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="14" transform="translate(367.333 387)">new</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(393.333 383)">(t)</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(419.666 383)">and</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(461.166 383)">R</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="14" transform="translate(476.5 377)">eff</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(492.073 383)">(t)</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(518.406 383)">from wastewater data</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(728.573 383)">rely</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(768.906 383)">on population</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(896.74 383)">-</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(903.906 383)">level shedding. However, this</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(82.4995 408)">approach can be biased</text><text fill="#953735" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(316 408)">when</text><text fill="#953735" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(372.833 408)">I</text><text fill="#953735" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="14" transform="translate(378.833 412)">new</text><text fill="#953735" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(404.833 408)">(t)</text><text fill="#953735" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(431.166 408)">is low or during the early phase of</text><text fill="#953735" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(756.166 408)">an</text><text fill="#953735" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(785.833 408)">epidemic</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(871 408)">. To address</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(992.913 408)">this issue</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(1081.75 408)">, this study</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(82.4995 434)">develops a model for robust estimation of epidemic</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(570 434)">dynamics</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(666 434)">by accounting for inter</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(876 434)">-</text><text fill="#4B5E68" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21" transform="translate(883.166 434)">individual shedding variability.</text></g></svg>